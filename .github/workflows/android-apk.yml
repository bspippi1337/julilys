name: BLCKSWAN Julilys APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BLCKSWAN-Julilys.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BLCKSWAN-Julilys-APK
          path: android/app/build/outputs/apk/debug/BLCKSWAN-Julilys.apk
          if-no-files-found: error
